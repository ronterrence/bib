{% extends "base.html" %}

{% block title %}Connexion | Bibliothèque municipale{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 460px;">
  <div class="card-body p-4 p-lg-5">
    <h1 class="h3 mb-4">Connexion du personnel</h1>
    {% if form.errors %}<div class="alert alert-danger">Identifiant ou mot de passe incorrect.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Identifiant</label>
        <input class="form-control" type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required id="{{ form.username.id_for_label }}">
      </div>
      <div class="mb-4">
        <label class="form-label" for="{{ form.password.id_for_label }}">Mot de passe</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required id="{{ form.password.id_for_label }}">
      </div>
      <button class="btn btn-primary w-100" type="submit">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
